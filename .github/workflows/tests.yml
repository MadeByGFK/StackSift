name: Tests

on:
  push:
    branches: [master, staging/p1, staging/*]
  pull_request:
    branches: [master, staging/p1, staging/*]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stacksift_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: stacksift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stacksift_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_AUTH_BROWSER: "1"
      TEST_POSTGRES_URL: postgresql+psycopg2://stacksift_test:local_test_only@localhost:5432/stacksift_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Install account-test browser
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest tests/ src/web/tests/ -v
