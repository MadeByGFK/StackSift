<script>
// ISSUE-68: the submit wiring lives in a named function so a form created
// after page load gets exactly the same handling (incl. the
// data-checkout-form redirect below) as the forms rendered into the page.
function wireAuthForm(form) {
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const output = form.querySelector('[role="status"]');
    const button = form.querySelector('button[type="submit"]');
    // Issue #80: the notify-me form (credits page) opts into richer submit
    // feedback via data-notify-feedback — its status element gets an
    // unmissable success/error state and the email input clears on success.
    // Forms without the attribute (login/signup/forgot/...) are untouched.
    const notifyFeedback = form.hasAttribute('data-notify-feedback');
    button.disabled = true;
    if (output) {
      output.textContent = '';
      if (notifyFeedback) output.classList.remove('notify-success', 'notify-error');
    }
    try {
      const response = await fetch(form.action, {
      headers: { "X-Requested-With": "XMLHttpRequest" },
        method: 'POST', credentials: 'same-origin', body: new FormData(form),
      });
      const result = await response.json();
      // ISSUE-130: a form may opt into a confirmation modal on success via
      // data-success-modal="<message>" (the password-reset form is the
      // first user). The modal replaces the inline status text so the
      // completed action ends with an explicit acknowledgement, which
      // hands the browser to data-success-url. Errors are untouched:
      // they still land in the status element exactly as before.
      const successModal = response.ok && form.hasAttribute('data-success-modal');
      if (output && !successModal) output.textContent = result.error || (typeof result.detail === 'string' ? result.detail : '') || result.message || 'Unable to complete this request. Please try again.';
      if (notifyFeedback && output) {
        output.classList.toggle('notify-success', response.ok);
        output.classList.toggle('notify-error', !response.ok);
        if (response.ok) {
          // The address is captured; an empty box plus the success banner
          // makes the outcome obvious. On error the typed address stays
          // in place so it can be corrected and resent.
          const emailInput = form.querySelector('input[type="email"]');
          if (emailInput) emailInput.value = '';
        }
      }
      if (successModal) {
        showSuccessModal(form.dataset.successModal, form.dataset.successUrl);
      } else if (response.ok && form.dataset.successUrl) location.assign(form.dataset.successUrl);
      // ISSUE-68: the credits-page buy forms (data-checkout-form) receive the
      // Stripe Checkout URL as JSON and hand the browser to Stripe.
      if (form.hasAttribute('data-checkout-form') && response.ok && result.checkout_url) location.assign(result.checkout_url);
    } catch (_) {
      if (output) {
        output.textContent = 'Unable to connect. Please try again.';
        if (notifyFeedback) output.classList.add('notify-error');
      }
    } finally {
      button.disabled = false;
    }
  });
}
// ISSUE-130: one-button confirmation modal, in the same visual pattern as
// the credit/error modals below. The action it confirms has ALREADY
// completed server-side, so every dismissal path (OK, Escape, overlay
// click) is an acknowledgement: close the modal and, when a target URL is
// given, navigate to it — there is nothing left to do on the old page
// (a used reset form cannot be resubmitted).
function showSuccessModal(message, url) {
  const old = document.getElementById('success-modal');
  if (old) old.remove();
  const overlay = document.createElement('div');
  overlay.id = 'success-modal';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;';
  const card = document.createElement('div');
  card.style.cssText = 'background:#1e2a4a;border:1px solid #2d3d6b;border-radius:12px;padding:2rem;max-width:400px;width:100%;color:#fff;';
  card.setAttribute('role', 'alertdialog');
  card.setAttribute('aria-label', message);
  const msg = document.createElement('p');
  msg.style.cssText = 'margin:0 0 1rem 0;font-size:1.05rem;';
  msg.textContent = message;
  card.appendChild(msg);
  const ok = document.createElement('button');
  ok.type = 'button';
  ok.textContent = 'OK';
  ok.style.cssText = 'display:block;width:100%;padding:0.7rem;background:#ecc94b;color:#1a1a2e;font-weight:700;border-radius:8px;border:none;cursor:pointer;font:inherit;';
  card.appendChild(ok);
  overlay.appendChild(card);
  document.body.appendChild(overlay);
  function acknowledge() {
    document.removeEventListener('keydown', esc);
    overlay.remove();
    if (url) location.assign(url);
  }
  function esc(e) { if (e.key === 'Escape') acknowledge(); }
  ok.addEventListener('click', acknowledge);
  overlay.addEventListener('click', e => { if (e.target === overlay) acknowledge(); });
  document.addEventListener('keydown', esc);
  ok.focus();
}

for (const form of document.querySelectorAll('form[data-auth-form]')) {
  wireAuthForm(form);
}

// Issue #164 Phase C (Decision 9 / C3): the header badge and the
// quick-buy pack modal are REMOVED with the retired balance API.
// The shared script's non-credit duties (wireAuthForm, success
// modals, PDF download handling) remain.

(function() {
  const forms = document.querySelectorAll('form[action$="/pdf"]');
  forms.forEach(form => {
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      let response;
      try {
        response = await fetch(form.action, {
          method: 'POST', credentials: 'same-origin', body: new FormData(form),
        });
        if (response.ok) {
          const blob = await response.blob();
          const disposition = response.headers.get('content-disposition') || 'attachment; filename=report.pdf';
          const filename = disposition.match(/filename="?([^"]+)"?/)[1];
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
        } else {
          const result = await response.json();
          const error = result.error || 'Export failed. Please try again.';
          const old = document.getElementById('error-modal');
          if (old) old.remove();
          const modal = document.createElement('div');
          modal.id = 'error-modal';
          modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;';
          const card = document.createElement('div');
          card.style.cssText = 'background:#1e2a4a;border:1px solid #2d3d6b;border-radius:12px;padding:2rem;max-width:400px;width:100%;color:#fff;';
          // Issue #164 Phase C: exports are free — the PDF error
          // modal has no insufficient-credits state and no
          // buy-credits handoff (the pack modal is retired).
          const close = document.createElement('button');
          close.style.cssText = 'width:100%;margin-top:1rem;padding:0.6rem;background:#2d3d6b;border:none;color:#fff;border-radius:8px;cursor:pointer;';
          close.textContent = 'Close';
          close.addEventListener('click', () => modal.remove());
          card.appendChild(close);
          modal.appendChild(card);
          modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
          document.body.appendChild(modal);
          document.addEventListener('keydown', function esc(e) {
            if (e.key === 'Escape') { modal.remove(); document.removeEventListener('keydown', esc); }
          });
        }
      } catch (_) {
        // Network failure: nothing was downloaded and no modal is
        // shown (pre-existing behaviour); the finally below still
        // re-enables the button.
      } finally {
        // Issue #136 consistency fix (the #129 closure quirk): the
        // submit button was previously re-enabled ONLY on a network
        // exception, so after a completed PDF download — and after
        // an error response — the PDF menu item stayed disabled for
        // the rest of the session until a page reload. Re-enabling
        // in finally keeps the disable as an in-flight guard only.
        button.disabled = false;
      }
    });
  });
})();
</script>
