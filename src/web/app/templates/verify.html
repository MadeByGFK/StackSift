<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email verification — StackSift</title>
<link rel="stylesheet" href="/static/style.css?v=3">
<style>
.auth-wrap { max-width: 420px; margin: 3rem auto; padding: 0 1rem; }
.auth-card { background: #1e2a4a; border: 1px solid #2d3d6b; border-radius: 12px; padding: 2rem; text-align: center; }
.auth-card h1 { color: #fff; margin: 0 0 0.5rem 0; font-size: 1.5rem; }
.auth-card p { color: #a0aec0; margin: 0 0 1rem 0; }
.auth-card .error { background: #4a1e1e; border: 1px solid #7a2a2a; color: #ff9999; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
.auth-card .success { background: #1e4a2a; border: 1px solid #2a7a4a; color: #99ffaa; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
.auth-links { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #a0aec0; }
.auth-links a { color: #ecc94b; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><a href="/" style="color:inherit;text-decoration:none">Stack<span>Sift</span></a></div>
    <a href="https://github.com/MadeByGFK/StackSift">GitHub</a>
  </header>
  <div class="auth-wrap">
    <div class="auth-card">
      {% if success %}
      <h1>Email verified!</h1>
      <div class="success">Your email has been verified. You can now log in.</div>
      <div class="auth-links"><a href="/login">Log in →</a></div>
      {% else %}
      <h1>Verification failed</h1>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <p>The verification link may have expired or already been used.</p>
      <div class="auth-links"><a href="/login">Back to login</a></div>
      {% endif %}
    </div>
  </div>
</div>
</body>
</html>
